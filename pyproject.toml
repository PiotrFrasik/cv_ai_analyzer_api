[project]
name = "cv-analyzer"
version = "0.1.0"
description = "CV AI Analyzer Django REST Framework application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django==6.1.1",
    "djangorestframework==3.18.1",
    "drf-spectacular==0.30.0",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "python-dotenv==1.2.3",
    "celery==5.6.3",
    "redis==8.1.0",
    "google-genai==2.25.0",
    "pymupdf==1.28.2",
    "psycopg[binary]==3.3.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
