services:

  redis:
    image: redis:latest
    container_name: redis-cv
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: postgres-cv
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: django-cv
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py collectstatic --no-input && gunicorn cv_analyzer.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./cv_analyzer:/app
      - ./staticfiles:/app/staticfiles
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  celery:
    build: .
    container_name: celery-cv
    restart: unless-stopped
    command: celery -A cv_analyzer worker --loglevel=info
    volumes:
      - ./cv_analyzer:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  postgres_data:
